<body>

  <!-- Top Ad Slot -->
  <div class="ad-slot" id="ad-top">

  <main>
    <h1>Is This Link Safe?</h1>
    <p class="tagline">This is a free link-safety checker for anyone who gets a suspicious URL in a text, email, or DM and wants a plain answer before they click it.</p>

    <!-- Ad Slot Above Button -->
    <div class="ad-slot ad-slot-above-btn" id="ad-above-button">
      <script>(function(s){s.dataset.zone='11829213',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
    </div>

    <div class="input-group">
      <input type="text" id="url-input" placeholder="Paste a link here…" autocomplete="off" spellcheck="false" autofocus aria-label="Enter a URL to check">
      <button id="check-btn" onclick="checkUrl()">Check</button>
    </div>

    <!-- Ad Slot Below Button -->
    <div class="ad-slot ad-slot-below-btn" id="ad-below-button">
      <!-- AD SLOT: Paste banner code here (Monetag / Adsterra) -->
    </div>

    <div id="result"></div>
  </main>

  <!-- Bottom Ad Slot -->
  <div class="ad-slot ad-slot-bottom" id="ad-bottom">
    <!-- PASTE YOUR AD CODE HERE (e.g. Monetag or Adsterra banner) -->
  </div>

  <footer>
    <p>Links are checked against the <a href="https://urlhaus.abuse.ch/" target="_blank" rel="noopener">URLhaus</a> malware database and analyzed for common phishing patterns. No data is stored. No login required.</p>
  </footer>

  <script>
    var input = document.getElementById('url-input');
    var btn = document.getElementById('check-btn');

    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') checkUrl();
    });

    function escapeHtml(text) {
      var div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function normalizeUrl(raw) {
      raw = raw.trim();
      if (!raw) return '';
      if (!/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(raw)) {
        raw = 'https://' + raw;
      }
      return raw;
    }

    async function checkUrl() {
      var raw = input.value.trim();
      if (!raw) {
        input.focus();
        return;
      }

      var url = normalizeUrl(raw);

      // Basic client-side URL validation
      try {
        new URL(url);
      } catch {
        showError('That does not look like a valid link. Please paste a full URL like https://example.com');
        return;
      }

      // Show loading
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Checking…';
      document.getElementById('result').classList.remove('visible');

      try {
        var response = await fetch('/.netlify/functions/check', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: url })
        });

        if (!response.ok) {
          var errData = await response.json().catch(function() { return {}; });
          throw new Error(errData.error || 'Server error (' + response.status + ')');
        }

        var data = await response.json();
        renderResults(data);
      } catch (err) {
        showError('Something went wrong: ' + escapeHtml(err.message) + '. Please try again.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Check';
      }
    }

    function showError(message) {
      var resultDiv = document.getElementById('result');
      resultDiv.innerHTML = '<div class="error-box">' + message + '</div>';
      resultDiv.classList.add('visible');
    }

    function renderResults(data) {
      var resultDiv = document.getElementById('result');

      // Verdict block
      var level = data.threatLevel;
      var emoji, title, desc;

      if (level === 'safe') {
        emoji = '✅';
        title = 'This link looks safe';
        desc = 'We checked this URL against malware databases and analyzed it for phishing patterns. No threats were found.';
      } else if (level === 'suspicious') {
        emoji = '⚠️';
        title = 'This link looks suspicious';
        desc = 'We found characteristics commonly associated with unsafe links. Proceed with caution or avoid clicking.';
      } else {
        emoji = '🚫';
        title = 'This link may be dangerous';
        desc = 'We found indicators that this link could be harmful. We recommend you do not click it.';
      }

      var html = '';
      html += '<div class="verdict verdict-' + level + '">';
      html += '<h2>' + emoji + ' ' + title + '</h2>';
      html += '<p>' + desc + '</p>';
      html += '</div>';

      html += '<p class="section-title">What we checked:</p>';
      html += '<ul class="checks">';

      for (var i = 0; i < data.findings.length; i++) {
        var f = data.findings[i];
        var sevClass, icon;
        if (f.severity === 'safe') { sevClass = 'check-safe'; icon = '✓'; }
        else if (f.severity === 'suspicious') { sevClass = 'check-warn'; icon = '!'; }
        else if (f.severity === 'dangerous') { sevClass = 'check-danger'; icon = '✗'; }
        else { sevClass = 'check-unknown'; icon = '?'; }

        html += '<li class="' + sevClass + '">';
        html += '<span class="check-icon">' + icon + '</span>';
        html += '<div>';
        html += '<div class="check-name">' + escapeHtml(f.check) + '</div>';
        html += '<div class="check-detail">' + escapeHtml(f.result) + '</div>';
        html += '</div>';
        html += '</li>';
      }

      html += '</ul>';
      html += '<div class="checked-url">Checked: ' + escapeHtml(data.url) + '</div>';
      html += '<div class="checked-at">Checked at ' + new Date(data.checkedAt).toLocaleString() + '</div>';

      resultDiv.innerHTML = html;
      resultDiv.classList.add('visible');
      resultDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  </script>
